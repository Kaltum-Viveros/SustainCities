<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SustainCities | Foro</title>
    <link href="estilos-foro.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <div class="sidebar">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="resources/img/logoSCsolo.png" alt="logo">
                <h2>SustainCities</h2>
            </div>
            <ul class="sidebar-links">
                <h4>
                    <span>Menú</span>
                    <div class="menu-separator"></div>
                </h4>
                <li>
                    <a id="inicio">
                        <i class='bx bxs-home'></i>
                        Inicio
                    </a>
                </li>
                <li>
                    <a id="misPost">
                        <i class='bx bxs-plus-square'></i>
                        Mis Posts
                    </a>
                </li>
                <li>
                    <a href="http://localhost/SustainCities/frontend/index.html">
                        <i class='bx bx-arrow-back'></i>
                        Sección Informativa
                    </a>
                </li>
                <li>
                    <a id="logout-btn" href="#">
                        <i class='bx bx-log-out bx-rotate-180'></i>
                        Cerrar Sesión
                    </a>
                </li>
            </ul>
            <div class="user-account">
                <div class="user-profile">
                    <i class='bx bxs-user-circle'></i>
                    <div class="user-detail">
                        <h3 id="user-primer-nombre">Cargando...</h3>
                        <span id="user-ciudad"></span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div class="main-content">
        <div id="contenedor"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="foro.js"></script>
</body>
</html>
